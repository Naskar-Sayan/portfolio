name: Government Jobs Daily Refresh

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/govjobs-scheduler.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout government-jobs development branch
        uses: actions/checkout@v4
        with:
          ref: govjob-development
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Discover secondary recruitment leads
        run: python crawler/news_discovery.py --output data/news_leads.json

      - name: Crawl official recruitment sources
        run: python crawler/govjob_crawler.py --days 15 --page-limit 700 --output data/jobs.json

      - name: Commit dataset if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/news_leads.json
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Refresh government jobs dataset"
            git push origin HEAD:govjob-development
          fi
