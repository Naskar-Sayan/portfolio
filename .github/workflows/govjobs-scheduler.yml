name: Government Jobs Daily Refresh
# Production crawler validation gate
# High-precision publication firewall
# Multi-agent discovery + open-web discovery + official-source verification

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/govjobs-scheduler.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout government-jobs development branch
        uses: actions/checkout@v4
        with:
          ref: govjob-development
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run crawler quality tests
        run: python -m pytest crawler/test_govjobs.py crawler/test_agents.py crawler/test_scope.py -q

      - name: Validate crawler syntax
        run: python -m py_compile crawler/agents.py crawler/web_discovery.py crawler/news_discovery.py crawler/govjob_crawler.py crawler/scope_filter.py crawler/qc_dataset.py

      - name: Discover secondary recruitment leads
        run: python crawler/news_discovery.py --output data/news_leads.json

      - name: Discover recruitment across the open web
        run: python crawler/web_discovery.py --output data/web_leads.json --per-query 8

      - name: Run exact 10-agent discovery
        run: python crawler/agents.py --output data/agent_leads.json

      - name: Bridge only scope-eligible official URLs
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "crawler")
          from scope_filter import is_indian_official, state_government_excluded, FOREIGN_HOST_MARKERS, host

          path = Path("data/news_leads.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          web = json.loads(Path("data/web_leads.json").read_text(encoding="utf-8"))
          agents = json.loads(Path("data/agent_leads.json").read_text(encoding="utf-8"))

          leads = data.get("leads", [])
          seen = {x.get("primary_source") or x.get("url") for x in leads}

          def eligible(url, title=""):
              if not url or not is_indian_official(url):
                  return False
              h = host(url)
              if any(h == x or h.endswith("." + x) for x in FOREIGN_HOST_MARKERS):
                  return False
              text = (title or "") + " " + url
              # Do not bridge explicit excluded state-government sources.
              pseudo = {"title": title, "organization": title, "url": url, "raw_text": text}
              if state_government_excluded(pseudo):
                  return False
              return True

          def add(url, title, query, verification):
              if not eligible(url, title) or url in seen:
                  return
              leads.append({
                  "url": url,
                  "title": title,
                  "snippet": "",
                  "query": query,
                  "discovered_at": data.get("generated_at"),
                  "primary_source": url,
                  "verification": verification,
              })
              seen.add(url)

          for item in web.get("official_sources", []):
              add(item.get("url"), item.get("title", ""), item.get("query", "official web discovery"), item.get("verification", "official"))

          for item in agents.get("candidates", []):
              url = item.get("primary_source") or item.get("notice_url")
              add(url, item.get("title", ""), item.get("query", item.get("agent", "multi-agent")), item.get("verification", "multi_agent_official"))

          data["leads"] = leads
          data["lead_count"] = len(leads)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Bridged {len(leads)} scope-eligible official leads.")
          PY

      - name: Crawl discovered official recruitment sources
        run: python crawler/govjob_crawler.py --days 30 --page-limit 1200 --output data/jobs.json

      - name: Apply hard publication scope and precision gate
        run: python crawler/scope_filter.py --input data/jobs.json --output data/jobs.json --rejected-output data/scope_rejections.json

      - name: Independent dataset QC - require at least 98% pass
        run: python crawler/qc_dataset.py --input data/jobs.json --min-score 0.98

      - name: Build alert digest from filtered dataset only
        run: python crawler/alerts.py --jobs data/jobs.json --state data/alert_state.json --output data/alerts.json --deadline-days 3

      - name: Send WhatsApp alert when configured
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_API_VERSION: v23.0
        run: python crawler/whatsapp_notify.py --input data/alerts.json

      - name: Commit dataset and audit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/news_leads.json data/web_leads.json data/agent_leads.json data/alerts.json data/alert_state.json data/scope_rejections.json
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Refresh high-precision government jobs dataset"
            git push origin HEAD:govjob-development
          fi

      - name: Publish refreshed dataset to live master branch
        run: |
          cp data/jobs.json /tmp/jobs.json
          cp data/news_leads.json /tmp/news_leads.json
          cp data/web_leads.json /tmp/web_leads.json
          cp data/agent_leads.json /tmp/agent_leads.json
          cp data/alerts.json /tmp/alerts.json
          cp data/alert_state.json /tmp/alert_state.json
          cp data/scope_rejections.json /tmp/scope_rejections.json
          git fetch origin master
          git checkout master
          cp /tmp/jobs.json data/jobs.json
          cp /tmp/news_leads.json data/news_leads.json
          cp /tmp/web_leads.json data/web_leads.json
          cp /tmp/agent_leads.json data/agent_leads.json
          cp /tmp/alerts.json data/alerts.json
          cp /tmp/alert_state.json data/alert_state.json
          cp /tmp/scope_rejections.json data/scope_rejections.json
          git add data/jobs.json data/news_leads.json data/web_leads.json data/agent_leads.json data/alerts.json data/alert_state.json data/scope_rejections.json
          if git diff --cached --quiet; then
            echo "Live master dataset already current."
          else
            git commit -m "Publish high-precision government jobs dataset"
            git push origin HEAD:master
          fi
